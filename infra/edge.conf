worker_processes 1;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 64k;
        server_tokens off;
        location = /healthz { return 200 'synthetic private runtime\n'; }
        # Task 14 activates only reviewed gateway/UI routes when they exist.
        # Never route any Cube REST, SQL, GraphQL, development or DB ingress.
        location / { return 503 'Gateway and publisher are not wired yet\n'; }
    }
}
