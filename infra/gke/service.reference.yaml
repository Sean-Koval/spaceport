{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "spaceport-api",
    "namespace": "REPLACE_WITH_APPROVED_NAMESPACE"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app.kubernetes.io/part-of": "spaceport-pilot",
      "app.kubernetes.io/name": "spaceport-api",
      "spaceport-role": "api"
    },
    "ports": [
      {
        "name": "http",
        "port": 8000,
        "targetPort": "http",
        "protocol": "TCP"
      }
    ]
  }
}
