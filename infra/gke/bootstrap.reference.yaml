                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "snapshot",
                    "mountPath": "/run/pilot/config",
                    "subPath": "runtime/config",
                    "readOnly": true
                  },
                  {
                    "name": "snapshot",
                    "mountPath": "/run/secrets",
                    "subPath": "runtime/secrets",
                    "readOnly": true
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  },
                  {
                    "name": "snapshot",
                    "mountPath": "/run/pilot/identities",
                    "subPath": "runtime/identities",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "projected-config",
                "configMap": {
                  "name": "REPLACE_WITH_VERSIONED_PILOT_CONFIGMAP",
                  "defaultMode": 288,
                  "items": [
                    {
                      "key": "pilot.json",
                      "path": "pilot.json"
                    },
                    {
                      "key": "registry-ca.pem",
                      "path": "registry-ca.pem"
                    }
                  ]
                }
              },
              {
                "name": "projected-secrets",
                "csi": {
                  "driver": "secrets-store-gke.csi.k8s.io",
                  "readOnly": true,
                  "volumeAttributes": {
                    "secretProviderClass": "REPLACE_WITH_APPROVED_BOOTSTRAP_SPC"
                  }
                }
              },
              {
                "name": "snapshot",
                "emptyDir": {
                  "medium": "Memory",
                  "sizeLimit": "8Mi"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {
                  "medium": "Memory",
                  "sizeLimit": "16Mi"
                }
              },
              {
                "name": "projected-identities",
                "configMap": {
                  "name": "REPLACE_WITH_REVIEWED_IDENTITIES_CONFIGMAP",
                  "defaultMode": 288,
                  "items": [
                    {
                      "key": "identities.json",
                      "path": "identities.json"
                    }
                  ]
                }
              }
            ],
            "restartPolicy": "Never"
          }
        }
      }
    }
  ]
}
