{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "name": "spaceport-migrate",
        "namespace": "REPLACE_WITH_APPROVED_NAMESPACE",
        "labels": {
          "app.kubernetes.io/part-of": "spaceport-pilot",
          "app.kubernetes.io/name": "spaceport-migrate",
          "spaceport-role": "migrate"
        }
      },
      "spec": {
        "suspend": true,
        "backoffLimit": 0,
        "activeDeadlineSeconds": 300,
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "spaceport-pilot",
              "app.kubernetes.io/name": "spaceport-migrate",
              "spaceport-role": "migrate"
            },
            "annotations": {
              "spaceport.example.com/acceptance": "Reference only; process availability is not domain readiness"
            }
          },
          "spec": {
            "serviceAccountName": "REPLACE_WITH_APPROVED_BOOTSTRAP_KSA",
            "automountServiceAccountToken": false,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "fsGroup": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "terminationGracePeriodSeconds": 140,
            "enableServiceLinks": false,
            "initContainers": [
              {
                "name": "snapshot-inputs",
                "image": "REPLACE_WITH_REGISTRY/spaceport@sha256:REPLACE_WITH_REVIEWED_IMAGE_DIGEST",
                "imagePullPolicy": "IfNotPresent",
                "command": [
                  "python",
                  "-m",
                  "gateway.pilot_mounts",
                  "migrate"
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "250m",
                    "memory": "64Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "projected-config",
                    "mountPath": "/mnt/pilot/config",
                    "readOnly": true
                  },
                  {
                    "name": "projected-secrets",
                    "mountPath": "/mnt/pilot/secrets",
                    "readOnly": true
                  },
                  {
                    "name": "snapshot",
                    "mountPath": "/mnt/snapshot"
                  }
                ]
              }
            ],
            "containers": [
              {
                "name": "migrate",
                "image": "REPLACE_WITH_REGISTRY/spaceport@sha256:REPLACE_WITH_REVIEWED_IMAGE_DIGEST",
                "imagePullPolicy": "IfNotPresent",
                "command": [
                  "python",
                  "-m",
                  "gateway.pilot_bootstrap",
                  "migrate"
                ],
                "env": [
                  {
                    "name": "GATEWAY_PILOT_CONFIG_FILE",
                    "value": "/run/pilot/config/pilot.json"
                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "snapshot",
                    "mountPath": "/run/pilot/config",
                    "subPath": "runtime/config",
                    "readOnly": true
                  },
                  {
                    "name": "snapshot",
                    "mountPath": "/run/secrets",
                    "subPath": "runtime/secrets",
                    "readOnly": true
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "projected-config",
                "configMap": {
                  "name": "REPLACE_WITH_VERSIONED_PILOT_CONFIGMAP",
                  "defaultMode": 288,
                  "items": [
                    {
                      "key": "pilot.json",
                      "path": "pilot.json"
                    },
                    {
                      "key": "registry-ca.pem",
                      "path": "registry-ca.pem"
                    }
                  ]
                }
              },
              {
                "name": "projected-secrets",
                "csi": {
                  "driver": "secrets-store-gke.csi.k8s.io",
                  "readOnly": true,
                  "volumeAttributes": {
                    "secretProviderClass": "REPLACE_WITH_APPROVED_BOOTSTRAP_SPC"
                  }
                }
              },
              {
                "name": "snapshot",
                "emptyDir": {
                  "medium": "Memory",
                  "sizeLimit": "8Mi"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {
                  "medium": "Memory",
                  "sizeLimit": "16Mi"
                }
              }
            ],
            "restartPolicy": "Never"
          }
        }
      }
    },
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "name": "spaceport-provision",
        "namespace": "REPLACE_WITH_APPROVED_NAMESPACE",
        "labels": {
          "app.kubernetes.io/part-of": "spaceport-pilot",
          "app.kubernetes.io/name": "spaceport-provision",
          "spaceport-role": "provision"
