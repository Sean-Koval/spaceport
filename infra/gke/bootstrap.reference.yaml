                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "cpu": "250m",
                    "memory": "64Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "projected-config",
                    "mountPath": "/mnt/pilot/config",
                    "readOnly": true
                  },
                  {
                    "name": "projected-secrets",
                    "mountPath": "/mnt/pilot/secrets",
