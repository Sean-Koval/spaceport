# Conditional TLS edge reference only. No edge workload or public Ingress is supplied.
# An operator must approve the public hostname, certificate delivery, network
# boundary, static frontend artifact, and all ingress before using this file.
worker_processes 1;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    # Check the original authority before replacing Host for the private hop.
    # $host alone strips the port and can fall back to server_name when absent.
    map $http_host $pilot_authority_valid {
        default 0;
        "spaceport.example.com" 1;
        "spaceport.example.com:443" 1;
    }
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8443 ssl;
        server_name spaceport.example.com;
        if ($host != spaceport.example.com) { return 444; }
        if ($pilot_authority_valid = 0) { return 444; }
        ssl_certificate /run/edge-tls/tls.crt;
        ssl_certificate_key /run/edge-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        client_max_body_size 64k;
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        # Shared by BOTH proxy locations. Identity comes only from bearer auth.
        proxy_http_version 1.1;
        proxy_set_header Host spaceport.example.com;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 180s;
        # This exact path must reach the gateway, never index.html.
        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://spaceport-api:8000;
        }
        location ~ ^/(v1(?:/|$)|mcp(?:/|$)|healthz$|readyz$) {
            proxy_pass http://spaceport-api:8000;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
