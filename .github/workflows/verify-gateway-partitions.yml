name: Verify complete backend in bounded serial partitions

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character candidate commit SHA
        type: string
        required: true
      manifest_sha256:
        description: Independently reviewed canonical manifest SHA256 for this exact candidate and trusted controller
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: spaceport-manual-verification
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest_count: ${{ steps.evidence.outputs.manifest_count }}
      manifest_encoded_length: ${{ steps.evidence.outputs.manifest_encoded_length }}
      manifest_decoded_length: ${{ steps.evidence.outputs.manifest_decoded_length }}
      manifest_sha256: ${{ steps.evidence.outputs.manifest_sha256 }}
      manifest_chunk_0: ${{ steps.evidence.outputs.manifest_chunk_0 }}
      manifest_chunk_1: ${{ steps.evidence.outputs.manifest_chunk_1 }}
      manifest_chunk_2: ${{ steps.evidence.outputs.manifest_chunk_2 }}
      manifest_chunk_3: ${{ steps.evidence.outputs.manifest_chunk_3 }}
      manifest_chunk_4: ${{ steps.evidence.outputs.manifest_chunk_4 }}
      manifest_chunk_5: ${{ steps.evidence.outputs.manifest_chunk_5 }}
      manifest_chunk_6: ${{ steps.evidence.outputs.manifest_chunk_6 }}
      manifest_chunk_7: ${{ steps.evidence.outputs.manifest_chunk_7 }}
      receipt_count: ${{ steps.evidence.outputs.receipt_count }}
      receipt_encoded_length: ${{ steps.evidence.outputs.receipt_encoded_length }}
      receipt_decoded_length: ${{ steps.evidence.outputs.receipt_decoded_length }}
      receipt_sha256: ${{ steps.evidence.outputs.receipt_sha256 }}
      receipt_chunk_0: ${{ steps.evidence.outputs.receipt_chunk_0 }}
      receipt_chunk_1: ${{ steps.evidence.outputs.receipt_chunk_1 }}
      receipt_chunk_2: ${{ steps.evidence.outputs.receipt_chunk_2 }}
    env:
      REVIEWED_SOURCE_SHA: ${{ inputs.source_sha }}
      REVIEWED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      DO_NOT_TRACK: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - name: Initialize bounded private job
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python3 - <<'PYINIT'
          import os, re, tempfile, time
          from pathlib import Path
          env=os.environ
          workspace=Path(env['GITHUB_WORKSPACE']).resolve()
          temporary=Path(env['RUNNER_TEMP'])
          if (not temporary.is_absolute() or not temporary.is_dir() or '..' in temporary.parts
              or any(p.is_symlink() for p in (temporary,*temporary.parents))
              or temporary==workspace or workspace in temporary.parents):
              raise SystemExit('BLOCKED: private external temporary root required')
          if (not re.fullmatch(r'[0-9a-f]{40}',env['GITHUB_WORKFLOW_SHA'])
              or not env['GITHUB_WORKFLOW_REF'].startswith(env['GITHUB_REPOSITORY']+'/.github/workflows/verify-gateway-partitions.yml@')
              or not re.fullmatch(r'[A-Za-z0-9_./@-]{1,512}',env['GITHUB_WORKFLOW_REF'])
              or any(not re.fullmatch(r'[1-9][0-9]{0,19}',env[k]) for k in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT'))):
              raise SystemExit('BLOCKED: immutable workflow identity required')
          parent=Path(tempfile.mkdtemp(prefix='gateway-partition.',dir=temporary))
          with open(env['GITHUB_ENV'],'a') as stream:
              for key,value in {'GATEWAY_CI_PARENT':parent,'GATEWAY_INTEGRATION_ROOT':parent/'run',
                  'GATEWAY_INTEGRATION_FIRST_STEP_EPOCH':int(time.time())}.items():
                  stream.write(f'{key}={value}\n')
          PYINIT
      - name: Check out trusted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.23'
          python-version: '3.12.14'
          enable-cache: false
      - name: Install separate locked controller and workload dependencies
        shell: bash
        run: |
          set -euo pipefail
          {
          uv python install 3.12.14
          uv sync --locked --dev --project trusted
          uv sync --locked --dev --project candidate
          [[ "$(uv self version --short)" == 0.12.23 ]]
          [[ "$(trusted/.venv/bin/python --version)" == 'Python 3.12.14' ]]
          [[ "$(candidate/.venv/bin/python --version)" == 'Python 3.12.14' ]]
          } > "$GATEWAY_CI_PARENT/python-setup.log" 2>&1
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Prepare exact run-private npm
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(node --version)" == v24.19.0 ]]
          {
          npm install --global --prefix "$GATEWAY_CI_PARENT/npm-tool" \
            --ignore-scripts --no-audit --no-fund npm@11.9.0
          [[ "$("$GATEWAY_CI_PARENT/npm-tool/bin/npm" --version)" == 11.9.0 ]]
          } > "$GATEWAY_CI_PARENT/npm-setup.log" 2>&1
          printf '%s/npm-tool/bin\n' "$GATEWAY_CI_PARENT" >> "$GITHUB_PATH"
      - name: Run fixed source gate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" run --candidate "$GITHUB_WORKSPACE/candidate" \
            --root "$GATEWAY_INTEGRATION_ROOT" --job source > "$GATEWAY_CI_PARENT/console.log" 2>&1
      - name: Always verify exact registered cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GATEWAY_INTEGRATION_ROOT:-}" ]]; then exit 0; fi
          [[ "$GATEWAY_INTEGRATION_ROOT" == "$GATEWAY_CI_PARENT/run" ]]
          [[ ! -L "$GATEWAY_INTEGRATION_ROOT" ]]
          if [[ ! -e "$GATEWAY_INTEGRATION_ROOT/context.json" ]]; then exit 0; fi
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" cleanup --candidate "$GITHUB_WORKSPACE/candidate" --root "$GATEWAY_INTEGRATION_ROOT"
      - name: Finalize closed evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GATEWAY_INTEGRATION_ROOT:-}" ]]
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" finalize --candidate "$GITHUB_WORKSPACE/candidate" --root "$GATEWAY_INTEGRATION_ROOT" --job source

  sql_owners:
    needs: [source]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
