          import os, re, tempfile, time
          from pathlib import Path
          env=os.environ
          workspace=Path(env['GITHUB_WORKSPACE']).resolve()
          temporary=Path(env['RUNNER_TEMP'])
          if (not temporary.is_absolute() or not temporary.is_dir() or '..' in temporary.parts
              or any(p.is_symlink() for p in (temporary,*temporary.parents))
              or temporary==workspace or workspace in temporary.parents):
              raise SystemExit('BLOCKED: private external temporary root required')
          if (not re.fullmatch(r'[0-9a-f]{40}',env['GITHUB_WORKFLOW_SHA'])
              or not env['GITHUB_WORKFLOW_REF'].startswith(env['GITHUB_REPOSITORY']+'/.github/workflows/verify-gateway-partitions.yml@')
              or not re.fullmatch(r'[A-Za-z0-9_./@-]{1,512}',env['GITHUB_WORKFLOW_REF'])
              or any(not re.fullmatch(r'[1-9][0-9]{0,19}',env[k]) for k in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT'))):
              raise SystemExit('BLOCKED: immutable workflow identity required')
          parent=Path(tempfile.mkdtemp(prefix='gateway-partition.',dir=temporary))
          with open(env['GITHUB_ENV'],'a') as stream:
              for key,value in {'GATEWAY_CI_PARENT':parent,'GATEWAY_INTEGRATION_ROOT':parent/'run',
                  'GATEWAY_INTEGRATION_FIRST_STEP_EPOCH':int(time.time())}.items():
                  stream.write(f'{key}={value}\n')
          PYINIT
      - name: Check out trusted bootstrap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Admit same-attempt source proof before setup
        env:
          SOURCE_MANIFEST_COUNT: ${{ needs.source.outputs.manifest_count }}
          SOURCE_MANIFEST_ENCODED_LENGTH: ${{ needs.source.outputs.manifest_encoded_length }}
          SOURCE_MANIFEST_DECODED_LENGTH: ${{ needs.source.outputs.manifest_decoded_length }}
          SOURCE_MANIFEST_SHA256: ${{ needs.source.outputs.manifest_sha256 }}
          SOURCE_MANIFEST_CHUNK_0: ${{ needs.source.outputs.manifest_chunk_0 }}
          SOURCE_MANIFEST_CHUNK_1: ${{ needs.source.outputs.manifest_chunk_1 }}
          SOURCE_MANIFEST_CHUNK_2: ${{ needs.source.outputs.manifest_chunk_2 }}
          SOURCE_MANIFEST_CHUNK_3: ${{ needs.source.outputs.manifest_chunk_3 }}
          SOURCE_MANIFEST_CHUNK_4: ${{ needs.source.outputs.manifest_chunk_4 }}
          SOURCE_MANIFEST_CHUNK_5: ${{ needs.source.outputs.manifest_chunk_5 }}
          SOURCE_MANIFEST_CHUNK_6: ${{ needs.source.outputs.manifest_chunk_6 }}
          SOURCE_MANIFEST_CHUNK_7: ${{ needs.source.outputs.manifest_chunk_7 }}
          SOURCE_RECEIPT_COUNT: ${{ needs.source.outputs.receipt_count }}
          SOURCE_RECEIPT_ENCODED_LENGTH: ${{ needs.source.outputs.receipt_encoded_length }}
          SOURCE_RECEIPT_DECODED_LENGTH: ${{ needs.source.outputs.receipt_decoded_length }}
          SOURCE_RECEIPT_SHA256: ${{ needs.source.outputs.receipt_sha256 }}
          SOURCE_RECEIPT_CHUNK_0: ${{ needs.source.outputs.receipt_chunk_0 }}
          SOURCE_RECEIPT_CHUNK_1: ${{ needs.source.outputs.receipt_chunk_1 }}
          SOURCE_RECEIPT_CHUNK_2: ${{ needs.source.outputs.receipt_chunk_2 }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" admit-lane \
            --candidate "$GITHUB_WORKSPACE/candidate" --job runtime_process_socket
      - name: Set up exact uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.23'
          python-version: '3.12.14'
          enable-cache: false
      - name: Install separate locked controller and workload dependencies
        shell: bash
        run: |
          set -euo pipefail
          {
          uv python install 3.12.14
          uv sync --locked --dev --project trusted
          uv sync --locked --dev --project candidate
          [[ "$(uv self version --short)" == 0.12.23 ]]
          [[ "$(trusted/.venv/bin/python --version)" == 'Python 3.12.14' ]]
          [[ "$(candidate/.venv/bin/python --version)" == 'Python 3.12.14' ]]
          } > "$GATEWAY_CI_PARENT/python-setup.log" 2>&1
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Prepare exact run-private npm
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(node --version)" == v24.19.0 ]]
          {
          npm install --global --prefix "$GATEWAY_CI_PARENT/npm-tool" \
            --ignore-scripts --no-audit --no-fund npm@11.9.0
          [[ "$("$GATEWAY_CI_PARENT/npm-tool/bin/npm" --version)" == 11.9.0 ]]
          } > "$GATEWAY_CI_PARENT/npm-setup.log" 2>&1
          printf '%s/npm-tool/bin\n' "$GATEWAY_CI_PARENT" >> "$GITHUB_PATH"
      - name: Run fixed runtime_process_socket gate
        env:
          SOURCE_MANIFEST_COUNT: ${{ needs.source.outputs.manifest_count }}
          SOURCE_MANIFEST_ENCODED_LENGTH: ${{ needs.source.outputs.manifest_encoded_length }}
          SOURCE_MANIFEST_DECODED_LENGTH: ${{ needs.source.outputs.manifest_decoded_length }}
          SOURCE_MANIFEST_SHA256: ${{ needs.source.outputs.manifest_sha256 }}
          SOURCE_MANIFEST_CHUNK_0: ${{ needs.source.outputs.manifest_chunk_0 }}
          SOURCE_MANIFEST_CHUNK_1: ${{ needs.source.outputs.manifest_chunk_1 }}
          SOURCE_MANIFEST_CHUNK_2: ${{ needs.source.outputs.manifest_chunk_2 }}
          SOURCE_MANIFEST_CHUNK_3: ${{ needs.source.outputs.manifest_chunk_3 }}
          SOURCE_MANIFEST_CHUNK_4: ${{ needs.source.outputs.manifest_chunk_4 }}
          SOURCE_MANIFEST_CHUNK_5: ${{ needs.source.outputs.manifest_chunk_5 }}
          SOURCE_MANIFEST_CHUNK_6: ${{ needs.source.outputs.manifest_chunk_6 }}
          SOURCE_MANIFEST_CHUNK_7: ${{ needs.source.outputs.manifest_chunk_7 }}
          SOURCE_RECEIPT_COUNT: ${{ needs.source.outputs.receipt_count }}
          SOURCE_RECEIPT_ENCODED_LENGTH: ${{ needs.source.outputs.receipt_encoded_length }}
          SOURCE_RECEIPT_DECODED_LENGTH: ${{ needs.source.outputs.receipt_decoded_length }}
          SOURCE_RECEIPT_SHA256: ${{ needs.source.outputs.receipt_sha256 }}
          SOURCE_RECEIPT_CHUNK_0: ${{ needs.source.outputs.receipt_chunk_0 }}
          SOURCE_RECEIPT_CHUNK_1: ${{ needs.source.outputs.receipt_chunk_1 }}
          SOURCE_RECEIPT_CHUNK_2: ${{ needs.source.outputs.receipt_chunk_2 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" run --candidate "$GITHUB_WORKSPACE/candidate" \
            --root "$GATEWAY_INTEGRATION_ROOT" --job runtime_process_socket > "$GATEWAY_CI_PARENT/console.log" 2>&1
      - name: Always verify exact registered cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GATEWAY_INTEGRATION_ROOT:-}" ]]; then exit 0; fi
          [[ "$GATEWAY_INTEGRATION_ROOT" == "$GATEWAY_CI_PARENT/run" ]]
          [[ ! -L "$GATEWAY_INTEGRATION_ROOT" ]]
          if [[ ! -e "$GATEWAY_INTEGRATION_ROOT/context.json" ]]; then exit 0; fi
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" cleanup --candidate "$GITHUB_WORKSPACE/candidate" --root "$GATEWAY_INTEGRATION_ROOT"
      - name: Finalize closed evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GATEWAY_INTEGRATION_ROOT:-}" ]]
          "$GITHUB_WORKSPACE/trusted/.venv/bin/python" -I -S "$GITHUB_WORKSPACE/trusted/scripts/ci_partition_driver.py" finalize --candidate "$GITHUB_WORKSPACE/candidate" --root "$GATEWAY_INTEGRATION_ROOT" --job runtime_process_socket

